type: specs.openrewrite.org/v1beta/recipe
name: com.example.rewrite.UpgradeToJava17Boot3AndSecurity6
displayName: Migrate to Spring Boot 3.5 and Security 6
description: |
  Migrate applications to the latest Spring Boot 3.5 and Spring Security 6. 
  This recipe will modify build files and deprecated APIs.
tags:
  - spring
  - boot
  - security
recipeList:
  # 1. Upgrade Java to 17
  - org.openrewrite.java.migrate.UpgradeToJava17

  # 2. Upgrade Spring Boot
  - org.openrewrite.java.spring.boot3.UpgradeSpringBoot_3_4
  - org.openrewrite.java.spring.boot3.SpringBootProperties_3_5

  # 3. Upgrade Spring Security - IMPORTANTE: ordine specifico
  - org.openrewrite.java.spring.security6.UpgradeSpringSecurity_6_0
  - org.openrewrite.java.spring.security6.UpgradeSpringSecurity_6_1
  - org.openrewrite.java.spring.security6.UpgradeSpringSecurity_6_2
  - org.openrewrite.java.spring.security6.UpgradeSpringSecurity_6_3

  # 4. Rimuovi WebSecurityConfigurerAdapter deprecato
  - org.openrewrite.java.spring.security5.RemoveUseOfDeprecatedWebSecurityConfigurerAdapter

  # 5. Update imports per javax -> jakarta
  - org.openrewrite.java.migrate.jakarta.JavaxMigrationToJakarta

  # 6. Upgrade dependencies
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.springframework.boot
      artifactId: "*"
      newVersion: 3.5.x
      overrideManagedVersion: false

  - org.openrewrite.maven.UpgradeParentVersion:
      groupId: org.springframework.boot
      artifactId: spring-boot-starter-parent
      newVersion: 3.5.x

  # 7. Upgrade JWT dependencies (se presenti)
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: io.jsonwebtoken
      artifactId: jjwt-api
      newVersion: 0.12.x
      overrideManagedVersion: false